name: Sync Docs from Rowan of Oakhaven Game Repo

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wiki Repo
        uses: actions/checkout@v4

      - name: Checkout Game Repo (Public docs & data only)
        uses: actions/checkout@v4
        with:
          repository: mquand/rowan-of-oakhaven
          token: ${{ secrets.GAME_REPO_TOKEN }}
          path: game-repo

      - name: Copy Public Docs & Clean Data
        run: |
          mkdir -p docs/data
          # Copy public markdown files
          cp -r game-repo/docs/public/* docs/
          # Filter internal fields from JSON data
          node scripts/filter-data.mjs
          rm -rf game-repo

      - name: Commit and Push Changes
        run: |
          git config user.name "Fluvio Bot"
          git config user.email "bot@fluviogames.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync docs from Rowan of Oakhaven [skip ci]"
          git push
